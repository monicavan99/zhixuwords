function parseStory(text,words){let n=0;return text.split(/\n/).map(p=>{let a=[],last=0;const re=/\[\[([^\]\n]+)\]\]/g;let m;while((m=re.exec(p))){if(m.index>last)a.push({type:'text',text:p.slice(last,m.index)});a.push({type:'word',wordId:m[1].trim(),occurrenceId:'o'+(++n)});last=re.lastIndex}if(last<p.length)a.push({type:'text',text:p.slice(last)});return a.length?a:[{type:'text',text:''}]})}

function openDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('IndexedDB 不可用'));let settled=false;const timer=setTimeout(()=>{if(!settled){settled=true;reject(Error('本地存储响应超时，已切换为临时模式'))}},6000);let r;try{r=indexedDB.open(CONFIG.db,1)}catch(e){clearTimeout(timer);reject(e);return}r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('store'))r.result.createObjectStore('store')};r.onsuccess=()=>{if(settled){r.result.close();return}settled=true;clearTimeout(timer);resolve(r.result)};r.onerror=()=>{if(!settled){settled=true;clearTimeout(timer);reject(r.error)}};r.onblocked=()=>{if(!settled){settled=true;clearTimeout(timer);reject(Error('其他窗口阻塞了本地存储，请关闭其他版本后重试'))}}})}

function dbRead(){return new Promise((res,rej)=>{const t=db.transaction('store'),store=t.objectStore('store');const c=store.get('content'),s=store.get('state'),legacy=store.get('snapshot');t.oncomplete=()=>res(c.result&&s.result?{content:c.result,state:s.result}:legacy.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||Error('读取中断'))})}
function dbWrite(snapshot){return new Promise((res,rej)=>{const t=db.transaction('store','readwrite'),store=t.objectStore('store');if(snapshot.content)store.put(snapshot.content,'content');store.put(snapshot.state,'state');store.delete('snapshot');t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||Error('保存中断'))})}
